id: ai-en-proposal-project-tool
chaff: 0.36.0
findings:
  - rule: ai-structure
    line: 1
    what: the textbook proposal outline (Summary, Current Situation, Proposed Solution, Expected Benefits, Costs, Implementation Plan, Risks and Mitigation, Recommendation) with bold-label lists
    verdict: missed
    note: ai-structure did not count it
  - rule: colon-lead-in
    line: 11
    what: '"This setup has several drawbacks:" and "All three offer the core features we need:" (21) hand over to lists'
    verdict: missed
    note: colon-lead-in is a ja-only rule; the English form is not counted
  - rule: bold-label-list
    line: 13
    what: three bold-label lists (drawbacks 13-17, benefits 33-37, risks 57-59), 13 items
    verdict: missed
    note: bold-label-list is a ja-only rule
  - rule: concrete-evidence-density
    line: 31
    text: ""
    message: Section "Expected Benefits" has no number, code or link (3 of 7 sections)
    verdict: correct
    note: the benefits are generic claims with no figure, though the document has one (two hours a week) to give; reads as boilerplate
  - rule: ai-structure
    line: 33
    what: the benefits list mirrors the drawbacks list item by item (out of date -> up-to-date status, ownership unclear -> clear accountability, ...)
    verdict: missed
    note: "candidate pattern: a benefits list that inverts the problems list"
  - rule: concrete-evidence-density
    line: 55
    text: ""
    message: Section "Risks and Mitigation" has no number, code or link (3 of 7 sections)
    verdict: false-positive
    note: risks and mitigations need no number
  - rule: concrete-evidence-density
    line: 61
    text: ""
    message: Section "Recommendation" has no number, code or link (3 of 7 sections)
    verdict: false-positive
    note: a one-paragraph recommendation; its fault is restating the summary, not a missing number
  - rule: closing-cliche
    line: 63
    what: '"We would be happy to discuss any questions or adjustments to this plan." after a recommendation that restates the summary'
    verdict: missed
    note: stock closing offer; the paragraph also restates the Summary
