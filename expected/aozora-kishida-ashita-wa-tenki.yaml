  - rule: clause-chain
    line: 577
    text: 何でもいい、早く夜が明けてくれ、空はなるだけ明るく、夢はなるだけ深く、かう心に祈
    message: 一文に節が 6 つつながっています（5 つまで）
    verdict: false-positive
    note: a character quoting his own wish (早く夜が明けてくれ、…); clause count is the author's choice in dialogue
  - rule: max-ten
    line: 585
    text: と思つたのは瞬間で、だんだん耳がはつきりして来るにつれて、つまり、お前がおれの枕
    message: 一文に読点が 9 個あります（6 個まで）
