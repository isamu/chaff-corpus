id: aozora-kishida-ashita-wa-tenki
chaff: 0.36.0
findings:
  - rule: heading-level-skip
    line: 12
    text: "#### 一"
    message: 見出し「一」の深さが 2 から 4 へ飛んでいます（3 のはず）
    verdict: false-positive
    note: 青空文庫's markup puts the author as h2 and each scene heading (中見出し) as h4; the work has no level between
  - rule: demonstrative-opener-run
    line: 81
    text: これが、お孝ちやん。これが、お隣の奥さん。これが、裏のお神さん……。
    message: 「これ」など、指示語で始まる文が 3 文続いています（2 文まで）
    verdict: false-positive
    note: a character pointing at people in a photograph one by one (これが、…。これが、…。); the repetition is the scene
  - rule: repeated-sentence-ending
    line: 299
    text: そこで、おれは、東京へ帰つたらなんて云はずに、今、これから、あなたの部屋へ行つて
    message: 「〜みた」で終わる文が 3 文続いています（2 文まで）
    verdict: false-positive
    note: a deliberate escalating triplet (…てみた ×3) in a character's story
  - rule: max-ten
    line: 301
    text: （寝返りをうつて、夫の方に向き直る。が、これこそ、口は自然に開くに任せ、鼻の孔は
    message: 一文に読点が 7 個あります（6 個まで）
    verdict: false-positive
    note: a stage direction in （） holding two sentences ending in 。 is read as one sentence
  - rule: clause-chain
    line: 365
    text: 一体、お前に限らないが、お前の家の人達は、お母さんにしろ、姉さんにしろ、お孝ちや
    message: 一文に節が 6 つつながっています（5 つまで）
    verdict: false-positive
    note: a character's scolding enumeration (お母さんにしろ、姉さんにしろ…); clause count is the author's choice in dialogue
  - rule: max-ten
    line: 365
    text: 一体、お前に限らないが、お前の家の人達は、お母さんにしろ、姉さんにしろ、お孝ちや
    message: 一文に読点が 7 個あります（6 個まで）
