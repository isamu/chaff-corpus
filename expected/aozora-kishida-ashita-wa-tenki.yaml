    note: a character's comma-paced account; commas are the author's choice in dialogue
  - rule: topic-predicate-distance
    line: 585
    text: と思つたのは瞬間で、だんだん耳がはつきりして来るにつれて、つまり、お前がおれの枕
    message: 「は」で出した主題から述語まで 95 字あります（80 字まで）
    verdict: false-positive
    note: the topic と思つたのは has its predicate (瞬間で) at once; the distance is taken to a later clause's predicate
  - rule: repeated-sentence-ending
    line: 589
