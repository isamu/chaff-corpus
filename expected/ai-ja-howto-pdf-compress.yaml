id: ai-ja-howto-pdf-compress
chaff: 0.36.0
findings:
  - rule: section-length-uniformity
    line: 1
    text: ""
    message: 節の長さのばらつきが 30% しかありません（35% 以上ほしい）
    verdict: false-positive
    note: "30%: sections of different kinds (an explanation, steps, a list); not noticeably even"
  - rule: no-mixed-desumasu
    line: 3
    text: 「添付ファイルが大きすぎます」と言われて、PDFが送れない。そんなときの対処法を
    message: この文だけ他と文末の調子が違います（本文の中で 1 文）
    verdict: false-positive
    note: a plain-form opening fragment for the situation, then です/ます; deliberate
  - rule: quote-without-source
    line: 3
    text: 添付ファイルが大きすぎます」と言われて、PDFが送れない。そんなときの対処法を、
    message: 「添付ファイルが大きすぎます」を人の言葉として引いていますが、出典（リンク、脚注、書誌）がありません
    verdict: false-positive
    note: an error message the reader sees, not a quoted person
  - rule: sentence-rhythm
    line: 3
    text: 「添付ファイルが大きすぎます」と言われて、PDFが送れない。そんなときの対処法を
    message: 文の長さのばらつきが 32%（36% 以上ほしい）
    verdict: unjudged
  - rule: list-item-form-mix
    line: 17
    text: 「Quartzフィルタ」で「Reduce File Size」を選んで保存
    message: 「「Quartzフィルタ」で「Reduce File Size」を選んで保存」は名詞で終わっています。この箇条書きのほかの項目は文で終わります（3 項目のうち 1 項目）
    verdict: correct
    note: 選んで保存 ends in a noun among steps ending in verbs
