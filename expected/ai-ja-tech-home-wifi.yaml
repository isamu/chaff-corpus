id: ai-ja-tech-home-wifi
chaff: 0.36.0
findings:
  - rule: section-length-uniformity
    line: 1
    text: ""
    message: 節の長さのばらつきが 23% しかありません（35% 以上ほしい）
    verdict: correct
    note: an experience post still cut into one even headed section per check step
  - rule: no-mixed-desumasu
    line: 3
    text: 動画は途中で止まるし、オンライン会議では自分の声が途切れていると言われる。プロバ
    message: この文だけ他と文末の調子が違います（本文の中で 1 文）
    verdict: false-positive
    note: a plain-form sentence as narration inside a です・ます post (〜と言われる。); a human device, not a slip
  - rule: sentence-rhythm
    line: 3
    text: 先月、家のWi-Fiが急に遅くなりました。動画は途中で止まるし、オンライン会議で
    message: 文の長さのばらつきが 32%（36% 以上ほしい）
    verdict: false-positive
    note: a personal account that mixes one-clause asides (正直、これがいちばん効きました。) with long sentences; at 32% a reader does not hear a drone
  - rule: test:invented-detail
    line: 5
    what: 「体験談」が確認手順の一覧と同じ順に進み、どの手順もきれいな数字（200→10→60Mbps）と教訓で終わる
    verdict: missed
    note: "candidate pattern: a checklist dressed as an anecdote; needs judgement. The persona's details (8年前の機種, テレビ台の裏) are invented"
  - rule: no-doubled-joshi
    line: 21
    text: のラックの下の段に押し込んでありました。見た目がすっきりするのでそうしていたので
    message: 「の」が読点を挟まずに 3 回続いています（2 回まで）
    verdict: false-positive
    note: 金属のラックの下の段 is a normal noun chain
  - rule: weasel-word
    line: 23
    text: 電子レンジや水槽の近く、壁の角なども電波が弱くなりやすいと言われているので、心当
    message: 「と言われている」は、誰が言ったのかを言っていません
    verdict: correct
    note: 「と言われている」 with no source; an editor would ask who says so. A mild AI sign
  - rule: ai-generated-composite
    line: 46
    what: section-length-uniformity and closing-cliche together
    verdict: missed
    note: section-length-uniformity (1) and closing-cliche (46) are correct; sentence-rhythm is false-positive (3), which leaves two, the blog limit; found by pending lab PRs
  - rule: closing-cliche
    line: 46
    what: 「同じように困っている方の参考になればうれしいです」 as the last line
    verdict: missed
    note: the Japanese "hope this helps", the rule's own example of a closing that only thanks the reader; found by pending lab PRs
