id: denkiyagi-sentakuteki-kokyu
chaff: 0.34.0
findings:
  - rule: heading-level-skip
    line: 3
    text: "### 第1条　目的"
    message: 見出し「第1条　目的」の深さが 1 から 3 へ飛んでいます（2 のはず）
    verdict: correct
  - rule: orthographic-variant
    line: 10
    text: 事を申出ることができる。
    message: 「事」と書いています（この文書はふつう「こと」と書く語です。5 箇所のうち 1 箇所が違う）
    verdict: correct
  - rule: orthographic-variant
    line: 12
    text: 出来る。
    message: 「出来る」と書いています（この文書はふつう「できる」と書く語です。3 箇所のうち 1 箇所が違う）
    verdict: correct
  - rule: orthographic-variant
    line: 19
    text: 申し出た場合、その月の始まる2週間前までに承認または不承認を決定し、従業員に通知
    message: 「申し出る」と書いています（この文書はふつう「申出る」と書く語です。5 箇所のうち 1 箇所が違う）
    verdict: false-positive
    note: the verb 申し出る counted against the noun 申出 (申出日, 申出); 公用文 writes the verb with okurigana and the noun without
  - rule: dangling-reference
    line: 20
    text: 第3条第3項の規定により承認を撤回する場合は、当該選択公休日の前日までに通知する
    message: 「第3条第3項」（番地 3.3）はこの文書にありません
    verdict: false-positive
    note: "第3条 has a paragraph 3 (the list item 3. right under the ### 第3条 heading, no blank line between)"
  - rule: yori-as-from
    line: 26
    text: より施行する。
    message: 起点の「より」は「から」と書けます
    verdict: correct
