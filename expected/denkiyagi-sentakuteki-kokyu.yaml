id: denkiyagi-sentakuteki-kokyu
chaff: 0.34.0
findings:
  - rule: heading-level-skip
    line: 3
    text: "### 第1条　目的"
    message: 見出し「第1条　目的」の深さが 1 から 3 へ飛んでいます（2 のはず）
    verdict: correct
  - rule: orthographic-variant
    line: 10
    text: 事を申出ることができる。
    message: 「事」と書いています（この文書はふつう「こと」と書く語です。5 箇所のうち 1 箇所が違う）
    verdict: correct
  - rule: orthographic-variant
    line: 12
    text: 出来る。
    message: 「出来る」と書いています（この文書はふつう「できる」と書く語です。3 箇所のうち 1 箇所が違う）
    verdict: correct
  - rule: orthographic-variant
    line: 18
    text: 申し出をしなければならない。
    message: 「申し出」と書いています（この文書はふつう「申出」と書く語です。4 箇所のうち 1 箇所が違う）
    verdict: correct
    note: the noun 申し出 where the document writes the noun 申出 (前項の申出, その申出, 利用の申出)
  - rule: yori-as-from
    line: 26
    text: より施行する。
    message: 起点の「より」は「から」と書けます
    verdict: correct
