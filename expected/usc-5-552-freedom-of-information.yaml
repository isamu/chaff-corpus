id: usc-5-552-freedom-of-information
chaff: 0.36.0
findings:
  - rule: nonstandard-word
    line: 444
    text: "be comprised of the following members:"
    message: '"be comprised of" is nonstandard in formal writing; write "comprise"'
    verdict: correct
  - rule: use-before-definition
    line: 531
    text: Act is now classified to section 3003 of
    message: '"Act" is used here, before it is defined on line 1185'
    verdict: false-positive
    note: '"Act" here is part of the name "National Security Act of 1947", not the term an executive order defines later'
  - rule: doubled-punctuation
    line: 997
    text: ..[sic] The head of an agency appointed
    message: 'Punctuation is doubled: ".."'
    verdict: correct
    note: the doubled period is in the enacted text, marked [sic] by the Code editors
  - rule: bracket-nesting
    line: 1069
    text: '"(c) Inapplicability of National Securit'
    message: Brackets nested 3 deep (limit 2)
    verdict: unjudged
  - rule: orthographic-variant
    line: 1287
    text: multi-track processing if used by such a
    message: '"multi-track" here, where the document usually writes "multitrack" (1 of 3)'
    verdict: correct
    note: '"multi-track" in the executive order against "multitrack" in the statute'
