id: usc-18-1030-computer-fraud
chaff: 0.36.0
findings:
  - rule: hyphen-as-dash
    line: 4
    text: " - CRIMES"
    message: '"-" stands in for a dash'
    verdict: false-positive
    note: a spaced hyphen separating a Code division label from its name (PART I - TITLE), the citation header's own convention
  - rule: title-case-consistency
    line: 11
    text: ""
    message: This heading's capitalisation differs from the rest (1 in this document)
    verdict: false-positive
    note: "the section catchline is in sentence case, the notes' headings in title case: two kinds of heading"
  - rule: numbering-gap
    line: 35
    text: (6) knowingly and with intent to defraud
    message: '"(6)" follows "(4)" (expected number 5)'
    verdict: false-positive
    note: a nested statutory enumeration ((A)(i), (ii) …) printed as flat paragraphs, or a combined label like "(c)(1)", read as one broken list
  - rule: bracket-nesting
    line: 123
    text: (2) The Federal Bureau of Investigation
    message: Brackets nested 3 deep (limit 2)
    verdict: unjudged
  - rule: unbalanced-bracket
    line: 123
    text: (as that term is defined in section 11y
    message: '"(" is never closed'
    verdict: correct
    note: the parenthesis opened before "as that term is defined" is never closed in the enacted text
  - rule: numbering-gap
    line: 127
    text: (e) As used in this section—
    message: '"(e)" follows "(c)" (expected number 4)'
    verdict: false-positive
    note: a nested statutory enumeration ((A)(i), (ii) …) printed as flat paragraphs, or a combined label like "(c)(1)", read as one broken list
