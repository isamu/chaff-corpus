id: mk-system-shutcho-ryohi
chaff: 0.34.0
findings:
  - rule: heading-level-skip
    line: 3
    text: "### 第1条 目的"
    message: 見出し「第1条 目的」の深さが 1 から 3 へ飛んでいます（2 のはず）
    verdict: correct
  - rule: latin-spacing
    line: 16
    text: " 種類とし、その定義は以下の各号に定めるところとする。"
    message: 日本語と前の数字のあいだを空けています（この文書はふつう詰める。3 箇所のうち 1 箇所が違う）
    verdict: correct
  - rule: orthographic-variant
    line: 31
    text: 及び航空機の利用は、他の交通手段が存在せず利用せざるを得ない、又は、利用した方が
    message: 「及び」と書いています（この文書はふつう「および」と書く語です。3 箇所のうち 1 箇所が違う）
    verdict: correct
  - rule: connective-hierarchy
    line: 37
    text: 並びにカーシェアを利用した出張を行った際、その運転者に対して日当を支給する。
    message: 「並びに」の文に、段の組になる語がありません（一段なら「及び」）
    verdict: correct
  - rule: yori-as-from
    line: 65
    text: より施行する。
    message: 起点の「より」は「から」と書けます
    verdict: correct
  - rule: kutoten-consistency
    line: 37
    what: an ASCII comma between Japanese words (自家用自動車,社用車) where the document writes 、
    verdict: missed
