id: jma-yougo-toki
chaff: 0.37.0
findings:
  - rule: heading-level-skip
    line: 3
    text: "### 年の用語"
    message: 見出し「年の用語」の深さが 1 から 3 へ飛んでいます（2 のはず）
    verdict: correct
    note: the page itself goes from h1 to h3
  - rule: orthographic-variant
    line: 48
    text: ごとに 更新している。
    message: 「ごと」と書いています（この文書はふつう「毎」と書く語です。3 箇所のうち 1 箇所が違う）
    verdict: correct
    note: the suffix itself is written both ways in the page, 10年ごと here and ５日毎 on lines 844 and 845; the rule takes no side on which spelling is right
  - rule: stray-space
    line: 48
    text: " 更新している。"
    message: 助詞「に」と「更新」のあいだに空白があります（この文書は文節のあいだをふつう詰めて書く。402 箇所のうち 1 箇所が空いている）
    verdict: correct
  - rule: hankaku-kana
    line: 58
    text: ･････ 。
    message: 半角の片仮名「･････」があります（全角は「・・・・・」）
    verdict: correct
    note: half-width middle dots used as an ellipsis
  - rule: orthographic-variant
    line: 214
    text: 今の時点からあと「しばらく」の期間。
    message: 「今」と書いています（この文書はふつう「いま」と書く語です。5 箇所のうち 1 箇所が違う）
    verdict: correct
  - rule: stray-space
    line: 280
    text: " の「今日」の予報では、発表時から正午までの期間に対して用いる。別図参照。"
    message: 「予報」と「の」は一続きの語句ですが、あいだに空白があります（710 箇所のうち 1 箇所が空いている）
    verdict: correct
  - rule: unbalanced-bracket
    line: 289
    text: ）」の二義があるが、後者の意味では対象時間が長いので用いない。
    message: 「(」を「）」で閉じています（全角と半角が違います）
    verdict: correct
    note: a half-width parenthesis closed by a full-width one
  - rule: bracket-width-consistency
    line: 493
    text: (来)
    message: 丸括弧を、全角で 44 箇所、半角で 16 箇所書いています。この文書には書き方が二通りあります
    verdict: correct
  - rule: hankaku-kana
    line: 611
    text: ･････ 現象の切れ間がおよそ１時間未満。
    message: 半角の片仮名「･････」があります（全角は「・・・・・」）
    verdict: correct
    note: half-width middle dots used as an ellipsis
  - rule: hankaku-kana
    line: 612
    text: ･････ 現象の切れ間がおよそ１時間以上。
    message: 半角の片仮名「･････」があります（全角は「・・・・・」）
    verdict: correct
    note: half-width middle dots used as an ellipsis
  - rule: no-doubled-joshi
    line: 613
    text: の現象の確認の難しさを考慮したものである。ただし、季節予報では１日またはそれ以上
    message: 「の」が読点を挟まずに 3 回続いています（2 回まで）
    verdict: unjudged
  - rule: orthographic-variant
    line: 625
    text: 時は一方に「のち」を用いる。その際の時間指定は降水現象を優先する。例えば「晴れ昼
    message: 「時」と書いています（この文書はふつう「とき」と書く語です。18 箇所のうち 1 箇所が違う）
    verdict: correct
  - rule: orthographic-variant
    line: 709
    text: ころ。
    message: 「ころ」と書いています（この文書はふつう「頃」と書く語です。6 箇所のうち 1 箇所が違う）
    verdict: correct
