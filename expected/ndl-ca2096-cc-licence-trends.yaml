id: ndl-ca2096-cc-licence-trends
chaff: 0.36.0
findings:
  - rule: heading-level-skip
    line: 3
    text: "### CCライセンスを付与する際の主な留意事項と最近の動向：「PD BY」と「"
    message: 見出し「CCライセンスを付与する際の主な留意事項と最近の動向：「PD BY」と「CCシグナル」」の深さが 1 から 3 へ飛んでいます（2 のはず）
    verdict: correct
    note: the page's h1 is its own title for the article (number, title, author) and the next heading, the article title again, is h3, so the committed text goes from h1 to h3; the rule exempts only the first heading, not one after a page or site title, the same shape as bousai-wp-r07-* (h1 then h4) and kantei-214/221
  - rule: abstract-length
    line: 7
    text: "#### 1. はじめに"
    message: 節を立てた論文ですが、要旨がありません
    verdict: false-positive
    note: カレントアウェアネス articles carry no abstract; the journal's format, not an omission
  - rule: topic-predicate-distance
    line: 13
    text: CCライセンスは、クリエイティブ・コモンズが提供している著作権者の意思表示ツール
    message: 「は」で出した主題から述語まで 133 字あります（80 字まで）
    verdict: unjudged
  - rule: topic-predicate-distance
    line: 53
    text: CCライセンスは、誰にでも分かるように書かれた「コモンズ証」、法律の専門家向けに
    message: 「は」で出した主題から述語まで 84 字あります（80 字まで）
    verdict: unjudged
  - rule: ngram-repetition
    line: 67
    text: 複数のCCライセンスが付与されている場合、利用者はいずれのCCライセンスが適用さ
    message: 「することができる」が 6 回出てきます（5 回まで）
    verdict: correct
    note: 「することができる」 six times in an article; 「できる」 would do
  - rule: empty-section
    line: 83
    text: "#### 3. CCライセンスを巡る最近の動向"
    message: 見出し「3. CCライセンスを巡る最近の動向」の下に中身がありません
    verdict: false-positive
    note: a section whose subsections sit at the same heading level (3. then 3.1); not empty
  - rule: max-ten
    line: 87
    text: こうしたCCライセンスの使われ方について、クリエイティブ・コモンズは、「功績を認
    message: 一文に読点が 8 個あります（6 個まで）
    verdict: unjudged
  - rule: no-doubled-joshi
    line: 91
    text: の分野固有のCCシグナルの検討も進めているとされている。CCシグナルは、基本的に
    message: 「の」が読点を挟まずに 3 回続いています（2 回まで）
    verdict: correct
    note: "「分野固有のCCシグナルの検討」 after another の: a chain of の"
  - rule: topic-predicate-distance
    line: 91
    text: CCシグナルは、基本的には「お願い」にとどまるものと考えられるが、国際的に統一さ
    message: 「は」で出した主題から述語まで 90 字あります（80 字まで）
    verdict: unjudged
  - rule: wordy-phrase
