    text: 海上自衛隊の護衛艦で航空自衛隊の戦闘機を運用することは自衛隊にとって初めての取組
    message: 「は」で出した主題から述語まで 88 字あります（80 字まで）
    verdict: false-positive
    note: "「運用することは」の述語「初めての取組であり」は 30 字ほど後で、後半は別の主語（〜ことも）の節"
