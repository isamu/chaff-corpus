id: ai-en-press-funding-round
chaff: 0.49.0
findings:
  - rule: preamble-length
    line: 5
    text: "**AUSTIN, Texas — November 24, 2026** —"
    message: 6 paragraphs before the first heading (limit 2)
    verdict: false-positive
    note: a press release tells the whole story before its boilerplate headings (About …); that is the genre's shape
  - rule: test:invented-detail
    line: 7
    what: the "4% to 10%" waste figure, 600 restaurants and the 23% reduction (11), both quotes (13, 20), the Waste Log feature (22), the 2,000-restaurant goal (17) and the co-investors (5) — not in the request
    verdict: missed
    note: "catalog B01 (invented detail): figures, quotes and a product launch a press release would publish as fact"
  - rule: cliche
    line: 20
    what: '"The results their customers are seeing speak for themselves." in the investor quote'
    verdict: missed
    note: 'candidate phrase: "speak for themselves", the stock close of a generated investor quote'
  - rule: heading-level-skip
    line: 24
    text: "### About Tallyroot"
    message: Heading "About Tallyroot" goes from level 1 to level 3 (expected 2)
    verdict: correct
    note: the title is level 1 and the boilerplate headings jump to level 3
