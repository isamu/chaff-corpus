id: shiki-banner-koukoku-boshu
chaff: 0.34.0
findings:
  - rule: date-format-consistency
    line: 7
    text: 2026年10月13日更新 印刷ページ表示
    message: 日付「2026年10月13日」の書き方が、この文書のほかの日付（「令和9年4月30日」など 2 箇所）と違います
    verdict: false-positive
    note: the CMS update stamp is in Western years; every date in the notice itself is 令和
  - rule: request-without-deadline
    line: 32
    text: 掲載するバナー広告デザインは広告依頼者が作成してください。
    message: この依頼には、いつまでに・誰がするかが書かれていません
    verdict: false-positive
    note: the request names who (広告依頼者), and its deadline is the application deadline given just below
  - rule: orthographic-variant
    line: 37
    text: 申し込みください。
    message: 「申し込む」と書いています（この文書はふつう「申込む」と書く語です。4 箇所のうち 1 箇所が違う）
    verdict: false-positive
    note: 公用文 writes the verb 申し込む and the noun 申込み; both forms are right where they are used
  - rule: max-kanji-continuous
    line: 44
    text: 353-8501
    message: 「志木市役所市政情報課宛」は漢字が 11 字続いています（10 字まで）
    verdict: false-positive
    note: a postal address line (office name plus 宛て), not prose
