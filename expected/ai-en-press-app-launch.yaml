    line: 9
    what: '"**Key features of the GreenLeaf app include:**"'
    verdict: missed
    note: catalog E19 (colon lead-in, en)
  - rule: bold-label-list
    line: 11
    what: '"- **Personalized watering schedules** based on …" (four items)'
    verdict: missed
    note: catalog E18 (bold labels, en)
  - rule: unfilled-placeholder
    line: 25
    text: "[Name]"
    message: '"[Name]" was never filled in'
