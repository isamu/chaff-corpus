id: shiki-sogyo-shien-keikaku
chaff: 0.34.0
findings:
  - rule: concrete-evidence-density
    line: 1
    text: ページの先頭です。 メニューを飛ばして本文へ
    message: 「ページの先頭です。」の節に数値もコードもリンクもありません（そういう節が 5/15）
    verdict: false-positive
    note: site navigation (header, breadcrumb or search box) that the html conversion kept; not the document's prose
  - rule: known-misspelling
    line: 13
    text: 公共財団法人埼玉県産業振興公社、志木街づくり株式会社の5者連携により、ワンストッ
    message: 「公共」は「公益」の書き誤りです
    verdict: unjudged
  - rule: max-sentence-length
    line: 13
    text: 創業マインドの掘り起こしや啓発をより推進するため、市、商工会、一般社団法人地域連
    message: この文は 156 文字あります（140 文字まで）
    verdict: correct
  - rule: ngram-repetition
    line: 19
    text: 特定創業支援等事業とは、1か月以上にわたる4回以上の継続的な支援で、創業に必要な
    message: 「創業に必要な4つ」が 7 回出てきます（5 回まで）
    verdict: correct
    note: the same certification sentence is repeated under seven items; one statement above the list would do
  - rule: bracket-width-consistency
    line: 45
    text: (電話：048-711-2222)
    message: 括弧を「(」と書いています（この文書はふつう「（」。19 箇所のうち 2 箇所が違う）
    verdict: correct
  - rule: bracket-width-consistency
    line: 50
    text: (電話：048-711-2222)
    message: 括弧を「(」と書いています（この文書はふつう「（」。19 箇所のうち 2 箇所が違う）
    verdict: correct
  - rule: max-sentence-length
    line: 75
    text: 会社設立時の登録免許税の軽減措置
    message: この文は 151 文字あります（140 文字まで）
    verdict: false-positive
    note: label lines with no 。 (a benefit's name, then its description) are joined with the following lines into one 'sentence'
  - rule: topic-predicate-distance
    line: 75
    text: 会社設立時の登録免許税の軽減措置
    message: 「は」で出した主題から述語まで 94 字あります（80 字まで）
    verdict: false-positive
    note: label lines with no 。 are joined with the following lines into one 'sentence', so the topic and predicate look far apart
  - rule: known-misspelling
    line: 82
    text: 第三保証人なしの創業関連保証が、事業開始の6か月前から利用可能
    message: 「第三」は「第三者」の書き誤りです
    verdict: unjudged
  - rule: no-mixed-desumasu
    line: 89
    text: 小規模事業者持続化補助金＜創業型＞
    message: この文だけ他と文末の調子が違います（本文の中で 1 文）
    verdict: correct
    note: the sentence that ends on the next line (〜対象になる。) is in plain form in a です/ます page
  - rule: no-doubled-joshi
    line: 90
    text: の小規模事業者の販路開拓等の取組を支援する小規模事業者持続化補助金＜創業型＞の申
    message: 「の」が読点を挟まずに 3 回続いています（2 回まで）
    verdict: correct
  - rule: concrete-evidence-density
    line: 99
    text: ""
    message: 「その他の支援等創業支援関連リンク」の節に数値もコードもリンクもありません（そういう節が 5/15）
    verdict: false-positive
    note: a section of links whose addresses the conversion dropped (＜外部リンク＞ labels); it is a link list
  - rule: concrete-evidence-density
    line: 110
    text: ""
    message: 「概要」の節に数値もコードもリンクもありません（そういう節が 5/15）
    verdict: unjudged
  - rule: concrete-evidence-density
    line: 116
    text: ""
    message: 「特徴」の節に数値もコードもリンクもありません（そういう節が 5/15）
