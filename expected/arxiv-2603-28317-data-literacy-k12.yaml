id: arxiv-2603-28317-data-literacy-k12
chaff: 0.36.0
findings:
  - rule: heading-level-skip
    line: 7
    text: "###### Abstract."
    message: Heading "Abstract." goes from level 1 to level 6 (expected 2)
    verdict: false-positive
    note: arXiv's HTML marks the abstract title as h6; the paper has no skipped level
  - rule: cliche
    line: 9
    text: However, understanding how data-driven s
    message: '"paradigm shift" is a cliché'
    verdict: correct
    note: "'paradigm shift' in the abstract"
  - rule: max-paragraph-length
    line: 17
    text: Data literacy is increasingly positioned
    message: This paragraph runs 10 sentences (limit 9)
    verdict: correct
    note: a ten-sentence paragraph
  - rule: comparative-without-baseline
    line: 31
    text: more directly legible. From an education
    message: '"more directly legible" does not say what it is compared with'
    verdict: unjudged
  - rule: latin-abbreviation-form
    line: 67
    text: e.g dessert reviews), to refining featur
    message: '"e.g" has some of its periods but not all'
    verdict: correct
    note: "'e.g' without its final period"
  - rule: figure-reference-order
    line: 69
    text: "Figure 1. Trajectory #1: Keeping transpa"
    message: Figure 1 is never referred to in the text
    verdict: correct
    note: "Trajectory #1 says 'see Figure 2' where Figure 1 is meant; the overview line reads 'Figures 2, 2, 4, and 4'"
  - rule: figure-reference-order
    line: 81
    text: "Figure 3. Trajectory #3: Jumping"
    message: Figure 3 is never referred to in the text
    verdict: correct
    note: "Trajectory #3 says 'see Figure 4' where Figure 3 is meant; Figure 3 is never cited"
  - rule: redundant-expression
    line: 109
    text: Though few in number, these instances we
    message: '"few in number" says the same thing twice'
    verdict: correct
    note: "'few in number' says it twice"
  - rule: hyphen-as-dash
    line: 128
    text: " - a comprehensive framework for data ed"
    message: '"-" stands in for a dash'
    verdict: unjudged
  - rule: hyphen-as-dash
    line: 130
    text: " - Challenges for Higher Education, M. E"
    message: '"-" stands in for a dash'
    verdict: unjudged
  - rule: fact-conflict
    line: 131
    text: "ISBN , Document Cited by: §1, §5.1."
    message: '"External Links" is ISBN here, but Document earlier in the same section'
    verdict: false-positive
    note: "reference-list metadata ('External Links: ISBN, Document') read as conflicting facts"
  - rule: space-before-punctuation
    line: 131
    text: " , Document Cited by: §1, §5.1."
    message: A space before ","
    verdict: false-positive
    note: the arXiv HTML leaves 'ISBN ,' where the bibliography style's ISBN value is empty; a conversion gap, not the authors' typing
  - rule: orthographic-variant
    line: 132
    text: k12 students in applied artificial intel
    message: '"k12" here, where the document usually writes "k-12" (1 of 5)'
    verdict: false-positive
    note: "'k12' inside a cited work's (lower-cased) title"
  - rule: spelling-consistency
    line: 133
    text: modeling. Science & Education 28 (8), pp
    message: '"modeling" here, where the document usually spells it "modelling" (3 of 13)'
    verdict: false-positive
    note: US spelling inside a cited work's title
  - rule: spelling-consistency
    line: 139
    text: centered evaluation of explainable ai ap
    message: '"centered" here, where the document usually spells it "centred" (3 of 13)'
    verdict: false-positive
    note: US spelling inside a cited work's title
  - rule: unknown-word
    line: 144
    text: mythos of model interpretability. Commun
    message: '"mythos" is not in the dictionary; did you mean "mythoi"?'
    verdict: false-positive
    note: "'mythos' is an English word (in a cited title)"
  - rule: unknown-word
