id: arxiv-2603-28317-data-literacy-k12
chaff: 0.36.0
findings:
  - rule: heading-level-skip
    line: 7
    text: "###### Abstract."
    message: Heading "Abstract." goes from level 1 to level 6 (expected 2)
    verdict: false-positive
    note: arXiv's HTML marks the abstract title as h6; the paper has no skipped level
  - rule: cliche
    line: 9
    text: However, understanding how data-driven s
    message: '"paradigm shift" is a cliché'
    verdict: correct
    note: "'paradigm shift' in the abstract"
  - rule: max-paragraph-length
    line: 17
    text: Data literacy is increasingly positioned
    message: This paragraph runs 10 sentences (limit 9)
    verdict: correct
    note: a ten-sentence paragraph
  - rule: comparative-without-baseline
    line: 31
    text: more directly legible. From an education
    message: '"more directly legible" does not say what it is compared with'
    verdict: unjudged
  - rule: latin-abbreviation-form
    line: 67
    text: e.g dessert reviews), to refining featur
    message: '"e.g" has some of its periods but not all'
    verdict: correct
    note: "'e.g' without its final period"
  - rule: figure-reference-order
    line: 69
    text: "Figure 1. Trajectory #1: Keeping transpa"
    message: Figure 1 is never referred to in the text
    verdict: correct
    note: "Trajectory #1 says 'see Figure 2' where Figure 1 is meant; the overview line reads 'Figures 2, 2, 4, and 4'"
  - rule: figure-reference-order
    line: 81
    text: "Figure 3. Trajectory #3: Jumping"
    message: Figure 3 is never referred to in the text
    verdict: correct
    note: "Trajectory #3 says 'see Figure 4' where Figure 3 is meant; Figure 3 is never cited"
  - rule: redundant-expression
    line: 109
    text: Though few in number, these instances we
    message: '"few in number" says the same thing twice'
    verdict: correct
    note: "'few in number' says it twice"
  - rule: sentence-spacing-consistency
    line: 125
    text: "  AAAI 37 (13), pp. 15990–15998.  Extern"
    message: Sentences are spaced two ways in this document (40 with two spaces, 44 with one)
    verdict: false-positive
    note: the arXiv HTML conversion joins the fields of a reference-list entry (or the author block) with two spaces; not sentence spacing the authors chose
  - rule: hyphen-as-dash
    line: 128
    text: " - a comprehensive framework for data ed"
    message: '"-" stands in for a dash'
