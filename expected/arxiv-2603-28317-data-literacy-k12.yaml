  - rule: hyphen-as-dash
    line: 130
    text: " - Challenges for Higher Education, M. E"
    message: '"-" stands in for a dash'
    verdict: unjudged
  - rule: fact-conflict
    line: 131
    text: "ISBN , Document Cited by: §1, §5.1."
