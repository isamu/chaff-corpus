    verdict: false-positive
    note: "reference-list metadata ('External Links: ISBN, Document') read as conflicting facts"
  - rule: space-before-punctuation
    line: 131
    text: " , Document Cited by: §1, §5.1."
    message: A space before ","
    verdict: false-positive
    note: the arXiv HTML leaves 'ISBN ,' where the bibliography style's ISBN value is empty; a conversion gap, not the authors' typing
