findings:
  - rule: orthographic-variant
    line: 4
    text: すべての参加者が本会から歓迎され、楽しんでいただくことを目指しています。
    message: 「すべて」と書いています（この文書はふつう「全て」と書く語です。4 箇所のうち 1 箇所が違う）
    verdict: correct
  - rule: orthographic-variant
    line: 5
    text: 皆様は、本行動規範に則って他の参加者に対して敬意と礼儀をもって参加いただくように
    message: 「皆様」と書いています（この文書はふつう「皆さま」と書く語です。3 箇所のうち 1 箇所が違う）
    verdict: correct
  - rule: translationese-density
    line: 8
    text: あなたの何気ない発言や行動で悲しむ人がいるかもしれません。注意深く、優しく振る舞
