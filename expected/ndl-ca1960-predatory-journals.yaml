id: ndl-ca1960-predatory-journals
chaff: 0.36.0
findings:
  - rule: heading-level-skip
    line: 3
    text: "### ハゲタカジャーナル問題 : 大学図書館員の視点から"
    message: "見出し「ハゲタカジャーナル問題 : 大学図書館員の視点から」の深さが 1 から 3 へ飛んでいます（2 のはず）"
    verdict: false-positive
    note: "the portal page gives its own title as h1 and the article title as h3; a web template, not the article"
  - rule: no-doubled-joshi
    line: 9
    text: の一連の毎日新聞の報道によって広く知られるようになった。とりわけ、過去15年弱の
    message: 「の」が読点を挟まずに 3 回続いています（2 回まで）
    verdict: correct
    note: "「2018年の一連の毎日新聞の報道」: three の in a row"
  - rule: orthographic-variant
    line: 17
    text: 様を想起して、これらをハゲタカジャーナルと呼ぶ。実際に米国連邦取引委員会から研究
    message: 「様」と書いています（この文書はふつう「よう」と書く語です。7 箇所のうち 1 箇所が違う）
    verdict: false-positive
    note: "「食い物にする様」 is さま (appearance), a different word from the よう of 〜のように"
  - rule: quote-without-source
    line: 19
    text: 内通者がいない限り「無査読」を証明することはできない」と指摘するように、根本的に
    message: 「内通者がいない限り「無査読」を証明することはできない」を人の言葉として引いていますが、出典（リンク、脚注、書誌）がありません
    verdict: unjudged
  - rule: max-kanji-continuous
    line: 33
    text: 既に有名学術誌掲載論文の中にもハゲタカジャーナル掲載論文を引用したものがあると報
    message: 「有名学術誌掲載論文」は漢字が 9 字続いています（8 字まで）
    verdict: correct
    note: "「有名学術誌掲載論文」 is a long kanji run an editor would split"
  - rule: topic-predicate-distance
    line: 43
    text: 同誌は2016年版（2017年6月更新）までJournal Impact Fac
    message: 「は」で出した主題から述語まで 121 字あります（80 字まで）
    verdict: unjudged
  - rule: taigen-dome-in-prose
    line: 55
    text: (2) 栗山正光. ハゲタカオープンアクセス出版社への警戒. 情報管理. 201
    message: 本文に体言止めが 16 文あります（4 文まで）
    verdict: false-positive
    note: "entries of the notes and references list counted as prose sentences"
  - rule: max-kanji-continuous
    line: 65
    text: 柴山昌彦文部科学大臣による記者会見での言及
    message: 「柴山昌彦文部科学大臣記者会見録」は漢字が 15 字続いています（8 字まで）
    verdict: false-positive
    note: "the title of a cited MEXT document (記者会見録), which cannot be reworded"
  - rule: date-format-consistency
    line: 66
    text: 平成30年12月25日）”. 2018-12-25.
    message: 日付「平成30年12月25日」の書き方が、この文書のほかの日付（「2019-08-20」など 49 箇所）と違います
    verdict: false-positive
    note: "a date inside the title of a cited document, not the article's own date style"
  - rule: max-kanji-continuous
    line: 76
    text: "北海道大学北キャンパス図書室. “午後の講座 : オープンアクセスとハゲタカジャ"
    message: 「北海道大学学術成果」は漢字が 9 字続いています（8 字まで）
    verdict: false-positive
    note: "the proper name of a university repository (北海道大学学術成果コレクション)"
  - rule: bracket-width-consistency
    line: 161
    text: (24)で示したJournal Citation ReportsのOncotar
    message: 括弧を「(」と書いています（この文書はふつう「（」。47 箇所のうち 2 箇所が違う）
    verdict: false-positive
    note: "a note number 注(24) written as the article's note markers are, (n) half-width"
  - rule: bracket-width-consistency
    line: 161
    text: )で示したJournal Citation ReportsのOncotarget
    message: 括弧を「)」と書いています（この文書はふつう「）」。47 箇所のうち 2 箇所が違う）
    verdict: false-positive
    note: "a note number 注(24) written as the article's note markers are, (n) half-width"
  - rule: doubled-punctuation
    line: 172
    text: 。. LRG. 2019, （26）, p. 136-147.
    message: 「。.」と句読点が重なっています
    verdict: false-positive
    note: "a cited title that ends with 。 followed by the citation's own separator, as SIST02 keeps it"
  - rule: latin-spacing
    line: 172
    text: " LRG編（第9回）粗悪学術誌「ハゲタカ」は、なぜ生まれたのか？その原因と対策に"
    message: 日本語と英字のあいだを空けています（この文書はふつう詰める。65 箇所のうち 1 箇所が違う）
    verdict: false-positive
    note: "a space inside a cited serial title, as published"
  - rule: latin-spacing
    line: 188
    text: " 4.0 国際 パブリック・ライセンスの下に提供されています。ライセンスの内容を"
    message: 日本語と後ろの数字のあいだを空けています（この文書はふつう詰める。10 箇所のうち 1 箇所が違う）
    verdict: false-positive
    note: "the official name of the CC licence, written with spaces as the portal's licence notice writes it"
  - rule: latin-spacing
    line: 188
    text: " 国際 パブリック・ライセンスの下に提供されています。ライセンスの内容を知りたい"
    message: 日本語と前の数字のあいだを空けています（この文書はふつう詰める。10 箇所のうち 1 箇所が違う）
    verdict: false-positive
    note: "the official name of the CC licence, written with spaces as the portal's licence notice writes it"
  - rule: no-mixed-desumasu
    line: 188
    text: ライセンスの内容を知りたい方は https://creativecommons.
    message: この文だけ他と文末の調子が違います（本文の中で 2 文）
    verdict: false-positive
    note: "the portal's licence notice appended to the article, in です/ます; not part of the article's prose"
  - rule: no-mixed-desumasu
    line: 188
    text: 本著作（CA1960）はクリエイティブ・コモンズ 表示 4.0 国際 パブリック
    message: この文だけ他と文末の調子が違います（本文の中で 2 文）
    verdict: false-positive
    note: "the portal's licence notice appended to the article, in です/ます; not part of the article's prose"
  - rule: stray-space
    line: 43
    what: a space inside the word 例えば (例 えば)
    verdict: missed
