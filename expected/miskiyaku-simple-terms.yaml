id: miskiyaku-simple-terms
chaff: 0.35.0
findings:
  - rule: tari-unpaired
    line: 4
    text: たり、より厳格に運営される場合は通常版のテンプレートをご参照ください。
    message: 「たり」が一つだけで、対になる「〜たり」がありません
    verdict: correct
  - rule: bracket-width-consistency
    line: 8
    text: (以下、本規約)は △△ による皆さんが ○○○○ を利用する上での規約を定める
    message: 括弧を「(」と書いています（この文書はふつう「（」。10 箇所のうち 4 箇所が違う）
    verdict: correct
  - rule: bracket-width-consistency
    line: 8
    text: )は △△ による皆さんが ○○○○ を利用する上での規約を定めるものです。
    message: 括弧を「)」と書いています（この文書はふつう「）」。10 箇所のうち 4 箇所が違う）
    verdict: correct
  - rule: doubled-word
    line: 8
    text: は △△ による皆さんが ○○○○ を利用する上での規約を定めるものです。
    message: 「はは」で語が重なっています。どちらかが余分です
    verdict: correct
    note: the topic particle は appears twice around the definition parenthesis (本利用規約は…本規約)は), a typo for one は
  - rule: orthographic-variant
    line: 13
    text: 事に関して適用されます。
    message: 「事」と書いています（この文書はふつう「こと」と書く語です。14 箇所のうち 3 箇所が違う）
    verdict: correct
  - rule: doubled-word
    line: 15
    text: が矛盾する場合には、個別規定を優先するものとします。
    message: 「がが」で語が重なっています。どちらかが余分です
    verdict: correct
  - rule: connective-hierarchy
    line: 28
    text: 並びに特定の宗教団体の活動を目的として申請した場合
    message: 「並びに」の文に、段の組になる語がありません（一段なら「及び」）
    verdict: correct
  - rule: tari-unpaired
    line: 51
    text: たり、妨害することを目的とした行為、なりすまし行為
    message: 「たり」が一つだけで、対になる「〜たり」がありません
    verdict: correct
  - rule: orthographic-variant
    line: 130
    text: 事が出来るものとします。
    message: 「事」と書いています（この文書はふつう「こと」と書く語です。14 箇所のうち 3 箇所が違う）
    verdict: correct
  - rule: connective-hierarchy
    line: 131
    text: 並びに本サービスの周知宣伝等に必要な範囲で利用できるものとし、ユーザーは当該利用
    message: 「並びに」の文に、段の組になる語がありません（一段なら「及び」）
    verdict: correct
  - rule: orthographic-variant
    line: 131
    text: ならびにその他既存の権利者に留保されるものとします。ただし管理者はこれらについて
    message: 「ならびに」と書いています（この文書はふつう「並びに」と書く語です。3 箇所のうち 1 箇所が違う）
    verdict: correct
  - rule: requirement-smell
    line: 131
    text: 等の著作権は利用者ならびにその他既存の権利者に留保されるものとします。ただし管理
    message: 要求の中の「等」は、ほかに何が含まれるのかを決めていません
    verdict: false-positive
    note: 「等」/「など」 closing an enumeration in a contract is the standard drafting device for an open list
  - rule: orthographic-variant
    line: 136
    text: 事も保証しません。
    message: 「事」と書いています（この文書はふつう「こと」と書く語です。14 箇所のうち 3 箇所が違う）
    verdict: correct
  - rule: orthographic-variant
    line: 136
    text: 無い事も保証しません。
    message: 「無い」と書いています（この文書はふつう「ない」と書く語です。5 箇所のうち 1 箇所が違う）
    verdict: correct
  - rule: obligation-without-deadline
    line: 152
    text: 通知します。
    message: 「通知」義務に期限がありません。いつまでにするかを書くと、守ったかどうかを決められます
    verdict: unjudged
  - rule: orthographic-variant
    line: 170
    text: 下さい。
    message: 「下さる」と書いています（この文書はふつう「くださる」と書く語です。5 箇所のうち 1 箇所が違う）
    verdict: correct
  - rule: bracket-width-consistency
    line: 188
    text: (必ず連絡がつく情報を記載)
    message: 括弧を「(」と書いています（この文書はふつう「（」。10 箇所のうち 4 箇所が違う）
    verdict: correct
  - rule: bracket-width-consistency
    line: 188
    text: )
    message: 括弧を「)」と書いています（この文書はふつう「）」。10 箇所のうち 4 箇所が違う）
    verdict: correct
