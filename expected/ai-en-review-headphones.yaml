id: ai-en-review-headphones
chaff: 0.36.0
findings:
  - rule: section-length-uniformity
    line: 1
    text: ""
    message: Section length varies by only 28% (want at least 35%)
    verdict: correct
    note: Short Version, then five feature sections of one size and a Verdict; the template product review
  - rule: ai-generated-composite
    line: 3
    text: After six months of daily use, here's my
    message: '"honesty-marker, section-length-uniformity" occur together in this document (2 signals, 2 needed)'
    verdict: unjudged
  - rule: ai-tell
    line: 3
    what: "\"here's my honest take\""
    verdict: missed
    note: candidate pattern (honesty marker)
  - rule: honesty-marker
    line: 3
    text: After six months of daily use, here's my
    message: '"my honest take" flags this sentence as candid'
    verdict: unjudged
  - rule: bold-label-list
    line: 7
    what: '"**Pros:**" / "**Cons:**" lists of exactly three each'
    verdict: missed
    note: catalog E18 and E14 (bold labels, every list three items)
  - rule: list-item-form-mix
    line: 15
    text: Call quality is average outdoors
    message: '"Call quality is average outdoors" opens with a verb; the other items in this list open with a noun phrase (1 of 3)'
    verdict: correct
    note: a clause among noun phrases in the cons list
  - rule: test:invented-detail
    line: 19
    what: '"a five-hour flight in June" and "a hot day in August" are experiences the user did not give'
    verdict: missed
    note: "catalog B01 (invented detail): the reviewer's own experience made up"
