id: da-agile-review-4
chaff: 0.33.0
findings:
  - rule: no-mixed-desumasu
    line: 5
    text: 本検討会の概要は、アジャイル開発に関する有識者検討会をご覧ください。
    message: この文だけ他と文末の調子が違います（本文の中で 1 文）
    verdict: false-positive
    note: a polite pointer to the page's readers before plain-form meeting notes; two voices by design
  - rule: bracket-nesting
    line: 41
    text: 東京都の「アジャイル型開発プレイブック（以下「プレイブック」という。）」に記載の
    message: 括弧が 3 重になっています（2 重まで）
    verdict: correct
    note: three levels of brackets (a quoted name holding a 以下「」という aside); an editor would simplify
  - rule: topic-predicate-distance
    line: 43
    text: 一方、POは仕様決定や、ステークホルダー調整等を実施する想定のため、デジタル庁に
    message: 「は」で出した主題から述語まで 87 字あります（80 字まで）
    verdict: false-positive
    note: the topic (POは) gets its predicate in the reason clause (実施する想定のため、); a new topic (〜かなどは) takes the rest
  - rule: max-sentence-length
    line: 44
    text: ただ、各スクラムチームが自律的にコストやスケジュールを判断する能力が不足している
    message: この文は 141 文字あります（140 文字まで）
    verdict: correct
    note: a sentence over the limit that an editor would split
  - rule: max-sentence-length
    line: 53
    text: アジャイル開発の実績等を有するベンダーを整理したデジタル庁内のデータベースである
    message: この文は 145 文字あります（140 文字まで）
    verdict: correct
    note: a sentence over the limit that an editor would split; its frame (〜の作成や、〜観点として) never closes
  - rule: topic-predicate-distance
    line: 65
    text: 1つ目は、委託先ベンダーの入れ替え時の引継ぎについては、単年度調達の場合でも、年
    message: 「は」で出した主題から述語まで 88 字あります（80 字まで）
    verdict: correct
    note: the topic (1つ目は) carries to the final predicate, just over the limit
  - rule: orthographic-variant
    line: 71
    text: 引き継ぐことはない。
    message: 「引き継ぐ」と書いています（この文書はふつう「引継ぐ」と書く語です。4 箇所のうち 1 箇所が違う）
    verdict: false-positive
    note: the verb 引き継ぐ beside the noun 引継ぎ; official style gives the noun and the verb different okurigana, so they are not variants
