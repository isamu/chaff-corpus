findings:
  - rule: heading-numbering-mix
    line: 1
    text: "# Deposit protection schemes and landlor"
    message: The heading "Deposit protection schemes and landlords" has no number, while 4 of its siblings do ("1. Overview")
    verdict: false-positive
    note: the page title (h1) is read as a sibling of the guide's numbered part headings (1. Overview)
  - rule: hyphen-as-dash
    line: 29
    text: " - known as a ‘custodial’ scheme"
    message: '"-" stands in for a dash'
