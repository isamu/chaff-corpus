    note: a spaced hyphen standing in for a dash
  - rule: hyphen-as-dash
    line: 30
    text: " - known as an ‘insured’ scheme"
    message: '"-" stands in for a dash'
    verdict: correct
    note: a spaced hyphen standing in for a dash
  - rule: contraction-consistency
    line: 40
    text: If you’re in an ‘insured’ scheme, you or
    message: "\"you're\" is written differently from the rest of the document"
    verdict: false-positive
    note: positive contractions (you’re, it’s) are counted against negatives kept in full (do not, cannot), which GOV.UK style keeps apart on purpose
  - rule: hyphen-as-dash
    line: 60
    text: " - for example, because your tenants dam"
    message: '"-" stands in for a dash'
