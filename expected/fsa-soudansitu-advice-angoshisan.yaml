id: fsa-soudansitu-advice-angoshisan
chaff: 0.36.0
findings:
  - rule: heading-level-skip
    line: 3
    text: "### 【相談事例等】"
    message: 見出し「【相談事例等】」の深さが 1 から 3 へ飛んでいます（2 のはず）
    verdict: correct
  - rule: orthographic-variant
    line: 10
    text: 下さい。暗号資産には、例えば、価格が急激に低下するリスクなど、暗号資産ごとに様々
    message: 「下さる」と書いています（この文書はふつう「くださる」と書く語です。5 箇所のうち 1 箇所が違う）
    verdict: correct
  - rule: list-marker-mix
    line: 12
    text: ・　登録を受けた暗号資産交換業者はこちら
    message: このリストだけ箇条書きの記号が「・」です（同じ深さのリストは 5 個が「-」）
    verdict: correct
  - rule: fullwidth-alnum-consistency
    line: 17
    text: ＩＣＯ（※１）に関する注意喚起はこちら
    message: 全角の「ＩＣＯ」と書いています（この文書はふつう半角の「ICO」。12 箇所のうち 2 箇所が違う）
    verdict: correct
  - rule: fullwidth-alnum-consistency
    line: 18
    text: ＩＣＯ（Initial Coin Offering）は、一般に、企業等が電子的に
    message: 全角の「ＩＣＯ」と書いています（この文書はふつう半角の「ICO」。12 箇所のうち 2 箇所が違う）
    verdict: correct
  - rule: name-variant
    line: 26
    text: 一般社団法人 日本暗号資産等取引業協会にご相談ください（ただし、当該協会会員会社
    message: 「一般社団法人 日本暗号資産等取引業協会」は、ほかの所では「一般社団法人日本暗号資産等取引業協会」と書いています（字の大小・幅・記号の違い）
    verdict: correct
  - rule: undefined-acronym
    line: 29
    text: TEL  03-3222-1061 ※月～金曜日 9:30～17:30
    message: 「TEL」が説明なしで使われています（説明のない略語 2 個）
    verdict: unjudged
  - rule: undefined-acronym
    line: 72
    text: ICOで発行された暗号資産を購入したが、未だに上場が実現していません。
    message: 「ICO」が説明なしで使われています（説明のない略語 2 個）
    verdict: unjudged
  - rule: requirement-smell
    line: 76
    text: などをしっかり理解した上で、自己責任で取引を行う必要があります。
    message: 要求の中の「など」は、ほかに何が含まれるのかを決めていません
    verdict: unjudged
  - rule: tari-unpaired
    line: 76
    text: たり、約束されていた商品やサービスが実際には提供されないリスクがあります。また、
    message: 「たり」が一つだけで、対になる「〜たり」がありません
    verdict: correct
