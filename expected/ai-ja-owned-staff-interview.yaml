id: ai-ja-owned-staff-interview
chaff: 0.36.0
findings:
  - rule: section-length-uniformity
    line: 1
    text: ""
    message: 節の長さのばらつきが 29% しかありません（35% 以上ほしい）
    verdict: false-positive
    note: an interview in four question sections; even sections are normal for the form
  - rule: concrete-evidence-density
    line: 5
    text: ""
    message: 「「自分に営業なんてできるのか」」の節に数値もコードもリンクもありません（そういう節が 3/5）
    verdict: false-positive
    note: an interview answer; no figures expected
  - rule: no-em-dash
    line: 7
    text: ――製造から営業への異動は、ご自身の希望だったんですか？
    message: 1000 字あたり 12 個のダッシュがあります（3 個まで）
    verdict: false-positive
    note: ―― marks the interviewer's question, the standard notation of a Japanese interview article
  - rule: ai-generated-composite
    line: 11
    what: 上司の言葉、客の言葉（19行）、工場の言葉（27行）をメモにないまま本人の発言として作っている
    verdict: missed
    note: "catalog B01 (invented detail): quotes put in a real employee's mouth on a recruiting site"
  - rule: concrete-evidence-density
    line: 13
    text: ""
    message: 「現場の言葉で話せる」の節に数値もコードもリンクもありません（そういう節が 3/5）
    verdict: false-positive
    note: as line 5
  - rule: no-mixed-desumasu
    line: 19
    text: 「この部品、ここの寸法がもう少し出ればいいんだけど」と言われたときに、どの工程を
    message: この文だけ他と文末の調子が違います（本文の中で 1 文）
    verdict: false-positive
    note: spoken answers in an interview; one plain-form sentence is natural speech
  - rule: ai-tell
    line: 21
    what: 見出し「工場との橋渡しも」
    verdict: missed
    note: catalog J22 (橋渡し)
