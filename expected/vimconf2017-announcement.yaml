id: vimconf2017-announcement
chaff: 0.35.0
findings:
  - rule: announced-count-mismatch
    line: 10
    text: 3行要約
    message: 「3行要約」と予告していますが、すぐ下の箇条書きは4項目です
    verdict: correct
    note: 3行要約 (a three-line summary) is followed by a list of four items
  - rule: list-item-form-mix
    line: 15
    text: 参加チケットの発売はまだ先 [^1]
    message: 「参加チケットの発売はまだ先  ^1」は名詞で終わっています。この箇条書きのほかの項目は文で終わります（3 項目のうち 1 項目）
    verdict: unjudged
  - rule: list-item-form-mix
    line: 31
    text: 年度ごとに国際化度のブレあり。完全英語の2013とベストエフォートのそれ以降
    message: 「年度ごとに国際化度のブレあり。」は文で終わっています。この箇条書きのほかの項目は名詞で終わります（3 項目のうち 1 項目）
    verdict: correct
  - rule: no-doubled-joshi
    line: 59
    text: の全てのVim使いの皆様が、
    message: 「の」が読点を挟まずに 3 回続いています（2 回まで）
    verdict: correct
