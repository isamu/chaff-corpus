id: jbaudit-r06-itaku-jinkenhi
title: "会計検査院: 国の委託事業の委託先及び国庫補助事業の補助事業者となっている会社において、虚偽の業務日誌を作成して実際には委託事業等の業務に全く従事していない者を従事したこととするなどして人件費が算定されていたため、委託費の支払額及び国庫補助金の交付額が過大となっていたもの［内閣府本府、こども家庭庁、文化庁、厚生労働本省、農林水産本省、水産庁、経済産業本省、資源エネルギー庁、特許庁、中小企業庁、北海道経済産業局、東北経済産業局、近畿経済産業局、四国経済産業局、九州経済産業局、国土交通本省、観光庁、環境本省、北海道地方環境事務所］（1）（17）（57）（78）（163）（164）（178）―（186）（210）（211）（218）（219）"
