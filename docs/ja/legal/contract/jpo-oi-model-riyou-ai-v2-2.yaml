notes: A model service agreement for a trained AI model, with a schedule (別紙). The Word file (逐条解説なし) converted with pandoc 3.8.3 (`pandoc -f docx -t gfm --wrap=none`); then only pandoc's empty bold markers around spaces (`**　**`, from bold whitespace in the Word file) were removed, and lines left holding only spaces were emptied; nothing else was edited. Word's automatic list numbering (1., ①, (ア)) comes out as Markdown ordered lists (1. 2. …) and its bullets as `-`; a manual line break inside a paragraph is a Markdown hard break (two trailing spaces). The parties are the model's placeholders X社/Y社, and ● marks blanks to fill in.
